name: Sync Knowledge to Orchestrator

on:
  push:
    branches: [main]
    paths:
      - 'knowledge/**/*.md'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install gray-matter

      - name: Sync knowledge entries
        env:
          HOLOSCRIPT_API_KEY: ${{ secrets.HOLOSCRIPT_API_KEY }}
          ORCHESTRATOR_URL: ${{ secrets.ORCHESTRATOR_URL }}
          WORKSPACE_ID: ${{ secrets.WORKSPACE_ID }}
        run: node .github/scripts/sync-knowledge.js
